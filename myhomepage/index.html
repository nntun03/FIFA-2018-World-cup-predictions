<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="theme-switcher">
            <button class="theme-button theme-blue" data-theme="theme-default"></button>
            <button class="theme-button theme-red" data-theme="theme-red"></button>
            <button class="theme-button theme-green" data-theme="theme-green"></button>
        </div>
        <h1>My Homepage</h1>
    </header>
    <div id="page-container">
        <main id="main-container">
            <div id="left-column">
                <div id="top-tab-system" class="tab-system">
                    <div class="tab-buttons-container"></div>
                    <div class="tab-contents-container"></div>
                </div>
                <div id="bottom-tab-system" class="tab-system">
                    <div class="tab-buttons-container"></div>
                    <div class="tab-contents-container"></div>
                </div>
            </div>
            <div id="right-column">
                <div class="dashboard-placeholder">
                    <h2>Dashboard</h2>
                    <p>This area is for your charts and other content.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
