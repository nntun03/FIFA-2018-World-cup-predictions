<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Homepage</h1>
        <button id="clear-data-button" title="Clear all local data">Clear Data</button>
    </header>
    <div id="page-container">
        <main id="main-container">
            <div id="left-column">
                <div class="links-container">
                    <!-- Saved links and folders will appear here -->
                </div>
                <div class="controls-container">
                    <form class="add-link-form">
                        <input type="text" name="linkName" placeholder="Name" required>
                        <input type="url" name="linkUrl" placeholder="URL" required>
                        <button type="submit">Add</button>
                    </form>
                    <button class="create-folder-button">Folder +</button>
                </div>
            </div>
            <div id="right-column">
                <div class="dashboard-placeholder">
                    <h2>Dashboard</h2>
                    <p>Embedded charts and other content will appear here.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
